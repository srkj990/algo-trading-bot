# Copy/adjust this file to override runtime defaults.
# Supported format: simple nested YAML mappings + scalars and lists.

execution_safety:
  min_ranked_candidate_score: 0.008 # used: minimum score required before a candidate can be ranked/actioned
  intraday_equity_auto_normal_min_confirmations: 2 # used: confirmations required in intraday-equity auto-adaptive mode
  reversal_exit_confirmation_candles: 2 # used: opposite-signal candles needed before reversal exit
  trailing_activation_stop_distance_multiplier: 1.0 # used: minimum multiple of stop distance before trailing can activate
  intraday_equity_entry_cutoff_minutes_before_squareoff: 30 # used: blocks fresh intraday-equity entries this many minutes before square-off
  exit_mode: "TRAIL_ONLY" # used: TRAIL_ONLY = when price hits target, activate trailing and continue; HARD_TARGET = exit immediately at target price

transaction_costs:
  enabled: true # used: enables transaction-cost-aware profitability checks and reporting
  slippage_pct_per_side: 0.0002 # used: assumed slippage per side in cost models
  expected_edge_score_multiplier: 1.0 # used: scales expected edge during intraday-equity edge-vs-cost filtering
  min_edge_to_cost_ratio: 1.2 # used: minimum expected-edge-to-cost ratio for intraday-equity entries
  cost_edge_buffer_rupees: 5.0 # used: extra rupee buffer added to required expected edge

data_cache:
  enabled: true # used: enables provider-level response caching
  ttl_seconds: 3 # used: cache time-to-live for market-data responses
  max_entries: 512 # used: max number of cached market-data entries retained
  per_cycle_enabled: true # used: enables one-cycle in-memory reuse of fetched datasets

session_defaults:
  exit_only_default: false # used: default session behavior; 'true' manages exits only and blocks fresh entries ; Set to `false` to allow entries
  live_broker_resync_interval_seconds: 60 # used: how often live sessions sync broker positions (exit-only mirrors exactly; normal mode adds newly detected manual positions)
  paper_trading_override: false # set true to bypass weekend + market-hours checks for paper/testing runs

risk_controls:
  daily_max_loss_pct: 0.15 # used: blocks new entries after realized daily loss exceeds 10% of capital
  consecutive_loss_limit: 3 # used: blocks new entries after this many losing closed trades in a row
  api_failure_pause_minutes: 5 # used: pause duration after scan/entry/API-style failures and abnormal slippage events
  max_orders_per_minute: 10 # used: live-order rate cap enforced in the shared order wrapper
  abnormal_slippage_pause_pct: 0.5 # used: pauses new entries when a filled live order slips by at least this percent

orders:
  enabled: true # used: enables runtime order validation and safety checks
  allowed_products: ["MIS", "CNC", "NRML"] # used: permitted broker products for submitted orders
  allowed_order_types: ["MARKET", "LIMIT", "SL", "SL-M"] # used: permitted broker order types
  min_quantity: 1 # used: minimum allowed order quantity
  max_live_order_notional: 100000 # used: hard cap on live order notional value
  reconcile_attempts: 3 # used: broker order-status polling attempts after submission
  reconcile_delay_seconds: 1.5 # used: delay between broker reconcile polls
  fill_confirmation_required: true # used: rejects unresolved live orders that never confirm fill state
  default_entry_order_type: "LIMIT" # used: default entry order type when the session builds orders
  entry_limit_price_buffer_pct: 0.0015 # used: buffer applied when synthesizing entry limit prices
  exit_limit_price_buffer_pct: 0.01 # used: buffer applied when synthesizing exit limit prices (SELL below LTP, BUY above LTP)
  max_spread_pct: 0.015 # used: global spread guard before live order placement
  margin_check_enabled: true # used: enables pre-order available-margin checks
  margin_buffer_pct: 0.05 # used: extra margin cushion applied to estimated required margin
  partial_fill_retry_enabled: true # used: enables retry flow for partially filled live orders
  partial_fill_retry_attempts: 1 # used: max retry attempts for partial fills
  rejection_retry_enabled: true # used: enables retry flow for rejected/cancelled live orders
  rejection_retry_attempts: 2 # used: max retry attempts after rejection/cancel
  rejection_retry_reduce_quantity_pct: 0.25 # used: size reduction applied when retrying rejected orders
  rejection_retry_price_buffer_pct: 0.002 # used: limit-price adjustment when retrying rejected orders

trade_store:
  enabled: true # used: enables JSONL persistence for trades and order-audit records
  base_dir: "state/trade_store" # used: directory where trade-store files are written
  include_paper_trades: true # used: persists paper-mode trades/orders in the trade store too

fno:
  intraday_options_max_trades_per_underlying: 5 # used: max filled intraday-option entries per underlying per day
  intraday_options_expiry_warning_days: 2 # used: blocks/warns near-expiry option setups based on days to expiry
  intraday_options_vega_crush_block_percent: 20 # used: filters setups when implied-volatility crush risk is too high
  intraday_options_min_range_pct: 0.35 # used: minimum underlying range percent for intraday-options regime checks
  intraday_options_min_signal_score: 0.03 # used: minimum score for intraday-options signals
  intraday_options_max_hold_minutes: 30 # used: max holding time before intraday-options time exit (overridable per session via time_exit_minutes)
  intraday_options_time_exit_cutoff: "15:10" # used: hard intraday-options time-based exit cutoff
  intraday_options_iv_expansion_max_iv_percentile: 20 # used: IV-expansion entry ceiling for IV percentile
  intraday_options_sideways_vwap_band_pct: 0.0015 # used: VWAP deviation band for sideways-regime classification
  intraday_options_sideways_lookback_candles: 8 # used: lookback window for sideways-regime checks
  intraday_options_regime_expansion_range_pct: 1.4 # used: range threshold for expansion-regime classification
  intraday_options_regime_sideways_range_pct: 0.55 # used: range threshold for sideways-regime classification
  intraday_options_regime_sideways_vwap_dev_pct: 0.0025 # used: VWAP-deviation threshold for sideways-regime classification
  intraday_options_regime_expansion_iv_change_pct: 2.0 # used: IV-change threshold for expansion-regime classification
  intraday_options_lot_mode: "CAPITAL_BASED" # used: default lot-sizing mode offered to intraday-options sessions/backtests
  intraday_options_entry_mode: "LIVE_TICK_CONFIRM" # used: default intraday-options entry mode for sessions/backtests (LIVE_STAGED | LEGACY_IMMEDIATE | LIVE_TICK_CONFIRM)
  intraday_options_max_entry_cost_ratio: 0.20 # used: blocks intraday-option entries when expected costs consume too much profit
  intraday_options_max_spread_pct: 0.015 # used: intraday-options-specific live spread guard
  intraday_options_min_open_interest: 10000 # used: minimum open interest for live intraday-options entry
  intraday_options_roll_trigger_pct: 2.0 # used: underlying-move threshold for dynamic ATM strike rolling
  intraday_options_theta_exit_ratio: 0.08 # used: theta-decay ratio threshold for intraday-options exit
  intraday_options_theta_exit_min_minutes: 10 # used: minimum hold before theta-decay exit logic can trigger

engine_defaults:
  delivery_equity:
    max_symbol_allocation: 0.25 # used: max capital allocation per delivery symbol
    nifty_trend_symbol: "NSE:NIFTY 50" # used: index symbol for delivery trend guard
    nifty_trend_ma_window: 50 # used: moving-average window for delivery trend guard
    max_hold_days: 5 # used: max business days to hold delivery positions
    sleep_seconds: 300 # used: session polling interval in seconds
    cooldown_seconds: 0 # used: post-entry cooldown before next entry is considered
    data_period: "6mo" # used: live session history lookback period
    data_interval: "1d" # used: live session candle interval
    adaptive_stop_multiplier_sideways: 2.4 # used: ATR stop multiplier in sideways regime
    adaptive_stop_multiplier_normal: 2.0 # used: ATR stop multiplier in normal regime
    adaptive_stop_multiplier_expansion: 1.8 # used: ATR stop multiplier in expansion regime
    adaptive_target_multiplier_sideways: 1.6 # used: ATR target multiplier in sideways regime
    adaptive_target_multiplier_normal: 2.6 # used: ATR target multiplier in normal regime
    adaptive_target_multiplier_expansion: 3.4 # used: ATR target multiplier in expansion regime
    adaptive_trailing_multiplier_sideways: 1.2 # used: ATR trailing multiplier in sideways regime
    adaptive_trailing_multiplier_normal: 1.5 # used: ATR trailing multiplier in normal regime
    adaptive_trailing_multiplier_expansion: 1.8 # used: ATR trailing multiplier in expansion regime
    adaptive_min_stop_pct: 0.018 # used: minimum stop distance as fraction of entry price
    adaptive_min_target_pct: 0.040 # used: minimum target distance as fraction of entry price
    adaptive_min_trailing_pct: 0.012 # used: minimum trailing distance as fraction of entry price
    adaptive_conviction_score_weight: 0.75 # used: how much signal score scales the conviction multiplier
    volatility_trailing_range_multiplier: 1.2 # used: swing-range multiplier for volatility trailing distance
  intraday_equity:
    gap_threshold_percent: 1.0 # used: classifies gap-up/gap-down context in intraday equity
    opening_range_candles: 15 # used: opening-range window size for intraday equity
    breakout_volume_multiplier: 1.2 # used: volume threshold for intraday-equity breakout filter
    square_off_time: "15:15" # used: time after which all intraday-equity positions are force-exited
    sleep_seconds: 60 # used: session polling interval in seconds
    cooldown_seconds: 300 # used: post-entry cooldown before next entry is considered
    data_period: "1d" # used: live session history lookback period
    data_interval: "1m" # used: live session candle interval
    adaptive_stop_multiplier_sideways: 1.6 # used: ATR stop multiplier in sideways regime
    adaptive_stop_multiplier_normal: 1.4 # used: ATR stop multiplier in normal regime
    adaptive_stop_multiplier_expansion: 1.4 # used: ATR stop multiplier in expansion regime
    adaptive_target_multiplier_sideways: 1.1 # used: ATR target multiplier in sideways regime
    adaptive_target_multiplier_normal: 1.6 # used: ATR target multiplier in normal regime
    adaptive_target_multiplier_expansion: 2.2 # used: ATR target multiplier in expansion regime
    adaptive_trailing_multiplier_sideways: 0.8 # used: ATR trailing multiplier in sideways regime
    adaptive_trailing_multiplier_normal: 1.0 # used: ATR trailing multiplier in normal regime
    adaptive_trailing_multiplier_expansion: 1.15 # used: ATR trailing multiplier in expansion regime
    adaptive_min_stop_pct: 0.0025 # used: minimum stop distance as fraction of entry price
    adaptive_min_target_pct: 0.0045 # used: minimum target distance as fraction of entry price
    adaptive_min_trailing_pct: 0.002 # used: minimum trailing distance as fraction of entry price
    adaptive_conviction_score_weight: 0.5 # used: how much signal score scales the conviction multiplier
  futures_equity:
    max_symbol_allocation: 0.25 # used: max capital allocation per futures-equity position
    sleep_seconds: 60 # used: session polling interval in seconds
    cooldown_seconds: 300 # used: post-entry cooldown before next entry is considered
    data_period: "3mo" # used: live session history lookback period
    data_interval: "5m" # used: live session candle interval
  options_equity:
    max_symbol_allocation: 0.25 # used: max capital allocation per options-equity position
    sleep_seconds: 60 # used: session polling interval in seconds
    cooldown_seconds: 300 # used: post-entry cooldown before next entry is considered
    data_period: "2mo" # used: live session history lookback period
    data_interval: "15m" # used: live session candle interval
  intraday_futures:
    max_symbol_allocation: 0.35 # used: max capital allocation per intraday-futures position
    entry_cutoff: "15:05" # used: time after which no new intraday-futures entries are allowed
    square_off_time: "15:15" # used: time after which all intraday-futures positions are force-exited
    sleep_seconds: 60 # used: session polling interval in seconds
    cooldown_seconds: 180 # used: post-entry cooldown before next entry is considered
    data_period: "15d" # used: live session history lookback period
    data_interval: "3m" # used: live session candle interval
  intraday_options:
    max_symbol_allocation: 0.2 # used: max capital allocation per intraday-options structure
    min_contract_price: 8.0 # used: blocks too-cheap option premiums
    min_abs_delta: 0.2 # used: minimum absolute delta for intraday-options entries
    max_buy_iv_percentile: 75.0 # used: buy-side IV percentile ceiling
    min_sell_iv_percentile: 15.0 # used: sell-side IV percentile floor
    entry_cutoff: "15:05" # used: time after which no new intraday-options entries are allowed
    square_off_time: "15:15" # used: time after which all intraday-options positions are force-exited
    sleep_seconds: 5 # used: session polling interval in seconds
    cooldown_seconds: 180 # used: post-entry cooldown before next entry is considered
    data_period: "1d" # used: live session history lookback period
    data_interval: "1m" # used: live session candle interval
    adaptive_stop_multiplier_sideways: 2.5 # used: ATR stop multiplier in sideways regime
    adaptive_stop_multiplier_normal: 2.2 # used: ATR stop multiplier in normal regime
    adaptive_stop_multiplier_expansion: 2.0 # used: ATR stop multiplier in expansion regime
    adaptive_target_multiplier_sideways: 1.5 # used: ATR target multiplier in sideways regime
    adaptive_target_multiplier_normal: 2.5 # used: ATR target multiplier in normal regime
    adaptive_target_multiplier_expansion: 3.0 # used: ATR target multiplier in expansion regime
    adaptive_trailing_multiplier_sideways: 0.6 # used: ATR trailing multiplier in sideways regime
    adaptive_trailing_multiplier_normal: 0.7 # used: ATR trailing multiplier in normal regime
    adaptive_trailing_multiplier_expansion: 0.8 # used: ATR trailing multiplier in expansion regime
    adaptive_min_stop_pct: 0.07 # used: minimum stop distance as fraction of entry price
    adaptive_min_target_pct: 0.08 # used: minimum target distance as fraction of entry price
    adaptive_min_trailing_pct: 0.035 # used: minimum trailing distance as fraction of entry price
    adaptive_conviction_score_weight: 0.5 # used: how much signal score scales the conviction multiplier
    momentum_volume_multiplier: 1.5 # used: momentum-entry volume-spike threshold
    momentum_spike_multiplier: 1.6 # used: max allowed candle-range spike for momentum entries
    momentum_min_body_ratio: 0.6 # used: minimum candle body ratio for momentum entries
    momentum_quality_lookback: 20 # used: lookback window for momentum quality stats
    momentum_fast_ema_span: 9 # used: fast EMA span for momentum staging
    momentum_confirmation_timeout_candles: 3 # used: timeout for momentum follow-through confirmation
    momentum_pullback_timeout_candles: 5 # used: timeout while waiting for momentum pullback entry
    momentum_pullback_band_pct: 0.0035 # used: EMA/VWAP pullback band for staged momentum entries
    mean_reversion_max_body_ratio: 0.55 # used: max candle body ratio for mean-reversion entries
    mean_reversion_spike_multiplier: 1.4 # used: max candle-range spike for mean-reversion entries
    mean_reversion_retest_band_pct: 0.0035 # used: VWAP retest band for mean-reversion entries
    mean_reversion_quality_lookback: 20 # used: lookback window for mean-reversion quality stats
    volatility_min_body_ratio: 0.45 # used: minimum body ratio for volatility-expansion entries
    volatility_range_multiplier: 1.2 # used: range-expansion threshold for volatility entries and trailing distance
    volatility_quality_lookback: 20 # used: lookback window for volatility quality stats
    runner_level_exit_fractions: [0.3, 0.4, 0.3] # used: lot split for smaller runner-style exits
    runner_partial_exit_lot_threshold: 2 # used: when total lots exceed this threshold, intraday-options runner exits switch to the larger multi-lot branch
    runner_level1_premium_target_pct: 8.0 # used: first premium target for larger multi-lot runner exits
    runner_level2_premium_target_pct: 15.0 # used: second premium target for larger multi-lot runner exits
    runner_partial_exit_fraction: 0.2 # used: first and second scale-out fraction for the larger multi-lot runner branch

backtest_defaults:
  risk_styles:
    intraday:
      "1":
        name: "CONSERVATIVE" # used: display name for intraday risk-style selection
        atr_stop_multiplier: 1.2 # used: ATR stop multiple for conservative intraday engines/backtests
        trailing_atr_multiplier: 0.8 # used: ATR trailing-stop multiple for conservative intraday engines/backtests
        target_risk_reward: 1.4 # used: risk-reward target for conservative intraday engines/backtests
        risk_percent: 0.005 # used: capital-at-risk percent for conservative intraday engines/backtests
      "2":
        name: "BALANCED" # used: display name for intraday risk-style selection
        atr_stop_multiplier: 1.35 # used: ATR stop multiple for balanced intraday engines/backtests
        trailing_atr_multiplier: 0.9 # used: ATR trailing-stop multiple for balanced intraday engines/backtests
        target_risk_reward: 1.5 # used: risk-reward target for balanced intraday engines/backtests
        risk_percent: 0.01 # used: capital-at-risk percent for balanced intraday engines/backtests
      "3":
        name: "AGGRESSIVE" # used: display name for intraday risk-style selection
        atr_stop_multiplier: 1.5 # used: ATR stop multiple for aggressive intraday engines/backtests
        trailing_atr_multiplier: 1.0 # used: ATR trailing-stop multiple for aggressive intraday engines/backtests
        target_risk_reward: 1.6 # used: risk-reward target for aggressive intraday engines/backtests
        risk_percent: 0.015 # used: capital-at-risk percent for aggressive intraday engines/backtests
    positional:
      "1":
        name: "CONSERVATIVE" # used: display name for positional risk-style selection
        atr_stop_multiplier: 1.5 # used: ATR stop multiple for conservative positional engines/backtests
        trailing_atr_multiplier: 1.0 # used: ATR trailing-stop multiple for conservative positional engines/backtests
        target_risk_reward: 1.8 # used: risk-reward target for conservative positional engines/backtests
        risk_percent: 0.005 # used: capital-at-risk percent for conservative positional engines/backtests
      "2":
        name: "BALANCED" # used: display name for positional risk-style selection
        atr_stop_multiplier: 1.65 # used: ATR stop multiple for balanced positional engines/backtests
        trailing_atr_multiplier: 1.25 # used: ATR trailing-stop multiple for balanced positional engines/backtests
        target_risk_reward: 2.0 # used: risk-reward target for balanced positional engines/backtests
        risk_percent: 0.01 # used: capital-at-risk percent for balanced positional engines/backtests
      "3":
        name: "AGGRESSIVE" # used: display name for positional risk-style selection
        atr_stop_multiplier: 1.8 # used: ATR stop multiple for aggressive positional engines/backtests
        trailing_atr_multiplier: 1.5 # used: ATR trailing-stop multiple for aggressive positional engines/backtests
        target_risk_reward: 2.2 # used: risk-reward target for aggressive positional engines/backtests
        risk_percent: 0.015 # used: capital-at-risk percent for aggressive positional engines/backtests
  default_data:
    intraday_equity:
      period: "5d" # used: default backtest lookback period for intraday equity
      interval: "5m" # used: default backtest candle interval for intraday equity
    delivery_equity:
      period: "6mo" # used: default backtest lookback period for delivery equity
      interval: "1d" # used: default backtest candle interval for delivery equity
    futures_equity:
      period: "2mo" # used: default backtest lookback period for futures equity
      interval: "15m" # used: default backtest candle interval for futures equity
    options_equity:
      period: "1mo" # used: default backtest lookback period for options equity
      interval: "15m" # used: default backtest candle interval for options equity
    intraday_futures:
      period: "5d" # used: default backtest lookback period for intraday futures
      interval: "5m" # used: default backtest candle interval for intraday futures
    intraday_options:
      period: "1d" # used: default backtest lookback period for intraday options
      interval: "1m" # used: default backtest candle interval for intraday options
  prompt_defaults:
    engine_choice: 6 # used: default engine selection for backtest CLI prompt
    capital: 100000 # used: default starting capital for backtest CLI prompt
    symbol_mode: 3 # used: default symbol-universe mode for backtest CLI prompt
    single_symbol_key: "1" # used: default single-symbol table selection for backtest CLI prompt
    fno_futures_base_symbol: 3 # used: default futures underlying choice for backtest CLI prompt
    fno_options_base_symbol: 1 # used: default options underlying choice for backtest CLI prompt
    expiry_choice: 1 # used: default expiry selection for backtest CLI prompt
    intraday_options_structure_mode: 1 # used: default intraday-options structure selection for backtest CLI prompt
    intraday_options_strike_mode: 1 # used: default ATM strike-mode selection for backtest CLI prompt
    fno_contract_confirm: 1 # used: default F&O contract confirmation choice for backtest CLI prompt
    intraday_options_strategy: 4 # used: default intraday-options strategy choice for backtest CLI prompt
    intraday_equity_strategy_mode: 2 # used: default intraday-equity strategy-mode choice for backtest CLI prompt
    default_strategy_mode: 2 # used: default generic strategy-mode choice for backtest CLI prompt
    single_strategy_key: "1" # used: default single-strategy selection for backtest CLI prompt
    risk_style: 3 # used: default risk-style selection for backtest CLI prompt
    max_positions: 1 # used: default max-open-positions value for backtest CLI prompt
    one_trade_per_symbol_per_day: 2 # used: default one-trade-per-symbol flag for backtest CLI prompt (1=YES, 2=NO)
    entry_selection_mode: 1 # used: default entry-selection mode for backtest CLI prompt
    top_n: 2 # used: default top-N entry count for backtest CLI prompt
    intraday_options_lot_mode: 2 # used: default intraday-options lot-sizing prompt choice in backtests
    intraday_options_entry_mode: 1 # used: default intraday-options entry-mode prompt choice in backtests (1=LIVE_TICK_CONFIRM, 2=LIVE_STAGED, 3=LEGACY_IMMEDIATE)
